name: equipe-04

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Lancez ./run.sh pour créer le fichier .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Lancez ./run.sh pour créer le fichier .env}
      POSTGRES_DB: ${POSTGRES_DB:?Lancez ./run.sh pour créer le fichier .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -bucket=${S3_BUCKET:-conversations}
      - -webdav=false
      - -admin.ui=false
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Lancez ./run.sh pour créer le fichier .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Lancez ./run.sh pour créer le fichier .env}
    volumes:
      - seaweedfs-data:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  ollama:
    image: ollama/ollama:0.40.16
    profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      # 11435 côté machine : 11434 est souvent déjà pris par un Ollama installé en local.
      - "${BIND_ADDRESS:-127.0.0.1}:${OLLAMA_PORT:-11435}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Télécharge le modèle au démarrage, puis s'arrête.
  ollama-pull:
    image: ollama/ollama:0.40.16
    profiles: [ollama]
    restart: on-failure:5
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    # Modèle de conversation, puis modèle d'embeddings pour le référentiel de compétences.
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_MODEL:-gemma4:12b} && ollama pull ${OLLAMA_EMBED_MODEL:-bge-m3}"]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Lancez ./run.sh pour créer le fichier .env}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-conversations}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:12b}
      OLLAMA_READER_MODEL: ${OLLAMA_READER_MODEL:-}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      READER_YIELDS_TO_CHAT: ${READER_YIELDS_TO_CHAT:-true}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Lancez ./run.sh pour créer le fichier .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SEED_DEMO: ${SEED_DEMO:-true}
      SEED_PSY_EMAIL: ${SEED_PSY_EMAIL:-psy@example.org}
      SEED_PSY_PASSWORD: ${SEED_PSY_PASSWORD:-}
      SEED_YOUTH_EMAIL: ${SEED_YOUTH_EMAIL:-sam@example.org}
      SEED_YOUTH_PASSWORD: ${SEED_YOUTH_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Les prompts se modifient sans reconstruire l'image.
      - ./backend/prompts:/app/prompts:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-5001}:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  seaweedfs-data:
  ollama-data:
