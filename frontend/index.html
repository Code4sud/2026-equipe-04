<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8ec" />
    <script>
      // Applique le thème choisi avant le premier affichage. Clair par défaut.
      try {
        if (localStorage.getItem('potentiel.theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#221710';
        }
      } catch {}
    </script>
    <meta name="description" content="Raconte ta vie et repère les talents que tu as déjà." />
    <link rel="icon" href="/icons/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Flair</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Bandeau commun du Hackathon Azuréen, demandé par les organisateurs. En async : un serveur
         lent ou injoignable ne retarde jamais l'app. src/bandeau.ts cale l'app sous le bandeau. -->
    <script src="https://orientation.code4sud.fr/bandeau.js" data-equipe="04" async></script>
  </body>
</html>
